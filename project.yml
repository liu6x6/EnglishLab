name: EnglishLab
options:
  bundleIdPrefix: com.liuxiaolong
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  VocabularyKit:
    path: Packages/VocabularyKit
  SubtitleKit:
    path: Packages/SubtitleKit
  ShadowingKit:
    path: Packages/ShadowingKit
  ReviewKit:
    path: Packages/ReviewKit
  WhisperCpp:
    path: Packages/WhisperCpp
targets:
  EnglishLab:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: VocabularyKit
      - package: SubtitleKit
      - package: ShadowingKit
      - package: ReviewKit
      - package: WhisperCpp
        product: WhisperCppKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuxiaolong.EnglishLab
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EnglishLab
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于录制你的跟读语音，与原音对比并评分。录音仅保存在本机。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用于识别你的跟读内容并给出逐词反馈，优先在设备本地完成。"
        CODE_SIGN_ENTITLEMENTS: App/EnglishLab.entitlements
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        DEAD_CODE_STRIPPING: YES
  EnglishLab-iOS:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: VocabularyKit
      - package: SubtitleKit
      - package: ShadowingKit
      - package: ReviewKit
      - package: WhisperCpp
        product: WhisperCppKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liuxiaolong.EnglishLab.iOS
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: EnglishLab
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "用于录制你的跟读语音，与原音对比并评分。录音仅保存在本机。"
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "用于识别你的跟读内容并给出逐词反馈，优先在设备本地完成。"
        INFOPLIST_KEY_UIBackgroundModes: "audio"
        INFOPLIST_FILE: App/Info-iOS.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: App/EnglishLab-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
schemes:
  EnglishLab:
    build:
      targets:
        EnglishLab: all
    run:
      config: Debug
    archive:
      config: Release
  EnglishLab-iOS:
    build:
      targets:
        EnglishLab-iOS: all
    run:
      config: Debug
    archive:
      config: Release
